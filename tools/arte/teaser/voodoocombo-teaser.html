<title>VoodooCombo Teaser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lilita+One&display=swap">
<style>
  /* Una sola pantalla de cine: fondo morado vudú, el vídeo centrado a 16:9 */
  :root {
    --bg: #0b0713;
    --panel: #160e22;
    --gold: #ffd23f;
    --dim: #b8a9d1;
    --display: "Lilita One", "Arial Black", system-ui, sans-serif;
    --body: "Baloo 2", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: var(--body);
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
  }
  .stage { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: grid; gap: 12px; }
  canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 14px; background: var(--panel); max-width: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--dim); font-size: 15px; }
  button {
    font-family: var(--display); font-size: 18px; letter-spacing: .02em;
    background: var(--gold); color: #160e22; border: 0; border-radius: 12px; padding: 8px 16px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>

<div class="stage">
  <canvas id="c" width="1920" height="1080" role="img" aria-label="Teaser animado de VoodooCombo: el logo aparece, cuatro muñecos vudú y una lluvia de doblones"></canvas>
  <div class="bar">
    <span>Teaser conceptual · escenas de diseño, no capturas del juego final</span>
    <button id="snd" type="button">Activar sonido</button>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1920, H = 1080, LOOP = 10;
const C = { bg:'#160e22', out:'#160e22', gold:'#ffd23f', goldHi:'#fff6c2', goldDk:'#c9971c', dim:'#b8a9d1',
            orange:'#ff9f1c', pink:'#ff4fd8', purple:'#8a5cc7', frost:'#7fe7ff' };
const PL = [
  { name:'CORAL', col:'#ff5a5f', shape:'circle', hat:null },
  { name:'AZUL',  col:'#3da5ff', shape:'tri',    hat:'top' },
  { name:'LIMA',  col:'#7be042', shape:'square', hat:'sprout' },
  { name:'HUESO', col:'#f3eefc', shape:'diamond',hat:'horns' },
];
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog = (t,a,b)=>clamp((t-a)/(b-a));
const lerp = (a,b,u)=>a+(b-a)*u;
const eOutCubic = u=>1-Math.pow(1-clamp(u),3);
const eOutBack = u=>{u=clamp(u)-1;const s=1.9;return u*u*((s+1)*u+s)+1;};
const eOutBounce = u=>{u=clamp(u);const n=7.5625,d=2.75;
  if(u<1/d)return n*u*u; if(u<2/d)return n*(u-=1.5/d)*u+.75; if(u<2.5/d)return n*(u-=2.25/d)*u+.9375; return n*(u-=2.625/d)*u+.984375;};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return `rgb(${r|0},${g|0},${b|0})`;}

// ---------- texto con contorno ----------
function text(s,x,y,size,{font='Lilita One',fill='#fff',ow=0,oc=C.out,align='center',sc=1,rot=0,alpha=1,shadow=null,weight=''}={}){
  if(alpha<=0||sc<=0)return;
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.rotate(rot); ctx.scale(sc,sc);
  ctx.font=`${weight} ${size}px "${font}"`; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.lineJoin='round';
  if(shadow){ctx.fillStyle=shadow[2]; if(ow){ctx.lineWidth=ow*2;ctx.strokeStyle=shadow[2];ctx.strokeText(s,shadow[0],shadow[1]);} ctx.fillText(s,shadow[0],shadow[1]);}
  if(ow){ctx.lineWidth=ow*2;ctx.strokeStyle=oc;ctx.strokeText(s,0,0);}
  if(typeof fill==='function'){ctx.fillStyle=fill(ctx.measureText(s).width,size);} else ctx.fillStyle=fill;
  ctx.fillText(s,0,0); ctx.restore();
}
const goldGrad=(w,h)=>{const g=ctx.createLinearGradient(0,-h*.45,0,h*.45);g.addColorStop(0,C.goldHi);g.addColorStop(.45,C.gold);g.addColorStop(1,C.goldDk);return g;};
const rainbow=t=>(w)=>{const g=ctx.createLinearGradient(-w/2,0,w/2,0);for(let k=0;k<7;k++)g.addColorStop(k/6,`hsl(${(k*50+t*220)%360},90%,62%)`);return g;};

// ---------- formas ----------
function shapePath(kind,x,y,r){ctx.beginPath();
  if(kind==='circle')ctx.arc(x,y,r,0,Math.PI*2);
  else if(kind==='tri'){ctx.moveTo(x,y-r*1.1);ctx.lineTo(x+r*1.05,y+r*.75);ctx.lineTo(x-r*1.05,y+r*.75);ctx.closePath();}
  else if(kind==='square')ctx.rect(x-r*.85,y-r*.85,r*1.7,r*1.7);
  else {ctx.moveTo(x,y-r*1.15);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*1.15);ctx.lineTo(x-r,y);ctx.closePath();}}
function fs(fill,stroke,lw){if(stroke&&lw){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.stroke();}ctx.fillStyle=fill;ctx.fill();}

// ---------- muñeco vudú ----------
function doll(p,x,y,r,t,{look=[0,.15],squash=0,tilt=0,pop=1,crown=false,blinkOff=0}={}){
  ctx.save();
  // sombra y marcador de jugador
  ctx.beginPath();ctx.ellipse(x,y+r*.98,r*.9*pop,r*.3*pop,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
  ctx.translate(x,y);ctx.scale(pop,pop);ctx.rotate(tilt);
  ctx.translate(0,r*.9);ctx.scale(1+squash,1-squash);ctx.translate(0,-r*.9);
  const ow=r*.17, col=p.col;
  for(const sx of[-1,1]){ctx.beginPath();ctx.ellipse(sx*r*.36,r*.8,r*.27,r*.18,0,0,Math.PI*2);fs(shade(col,-.35),C.out,ow*2);}
  const body=()=>{ctx.beginPath();ctx.ellipse(0,r*.36,r*.74,r*.56,0,0,Math.PI*2);ctx.moveTo(r*.8,-r*.34);ctx.arc(0,-r*.34,r*.8,0,Math.PI*2);};
  body();ctx.lineWidth=ow*2;ctx.strokeStyle=C.out;ctx.lineJoin='round';ctx.stroke();
  const g=ctx.createLinearGradient(0,-r*1.15,0,r*.95);g.addColorStop(0,shade(col,.18));g.addColorStop(.55,col);g.addColorStop(1,shade(col,-.28));
  body();ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.translate(-r*.34,-r*.78);ctx.rotate(-.55);ctx.beginPath();ctx.ellipse(0,0,r*.24,r*.11,0,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.38)';ctx.fill();ctx.restore();
  // costura en X
  const k=r*.15;ctx.lineCap='round';ctx.lineWidth=r*.085;ctx.strokeStyle=shade(col,-.6);
  ctx.beginPath();ctx.moveTo(-k,r*.42-k);ctx.lineTo(k,r*.42+k);ctx.moveTo(-k,r*.42+k);ctx.lineTo(k,r*.42-k);ctx.stroke();
  // ojos de botón
  const blink=((t+blinkOff)%3.1)<.12;
  for(const sx of[-1,1]){const ex=sx*r*.31,ey=-r*.4;
    if(blink){ctx.beginPath();ctx.moveTo(ex-r*.17,ey);ctx.lineTo(ex+r*.17,ey);ctx.lineWidth=r*.08;ctx.strokeStyle=C.out;ctx.stroke();continue;}
    ctx.beginPath();ctx.arc(ex,ey,r*.22,0,Math.PI*2);fs('#1e1430',C.out,r*.06);
    ctx.beginPath();ctx.arc(ex,ey,r*.15,0,Math.PI*2);ctx.lineWidth=r*.035;ctx.strokeStyle='#3b2c52';ctx.stroke();
    const hx=ex+look[0]*r*.06,hy=ey+look[1]*r*.06;ctx.fillStyle='#ede6fa';
    for(const[a,b]of[[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.beginPath();ctx.arc(hx+a*r*.055,hy+b*r*.055,r*.035,0,Math.PI*2);ctx.fill();}}
  // boca cosida
  ctx.beginPath();ctx.moveTo(-r*.2,-r*.05);for(let i=1;i<=5;i++)ctx.lineTo(-r*.2+i*r*.08,-r*.05+(i%2?r*.05:0));
  ctx.lineWidth=r*.055;ctx.strokeStyle=C.out;ctx.stroke();
  // accesorio
  if(p.hat==='top'){ctx.beginPath();ctx.ellipse(0,-r*1.03,r*.6,r*.14,0,0,Math.PI*2);fs('#1e1a2b',C.out,ow*1.4);
    ctx.beginPath();ctx.rect(-r*.36,-r*1.62,r*.72,r*.6);fs('#1e1a2b',C.out,ow*1.4);ctx.fillStyle='#ff5a5f';ctx.fillRect(-r*.36,-r*1.16,r*.72,r*.12);}
  if(p.hat==='sprout'){ctx.beginPath();ctx.moveTo(0,-r*1.1);ctx.lineTo(r*.04,-r*1.45);ctx.lineWidth=r*.08;ctx.strokeStyle='#2f6b2a';ctx.stroke();
    for(const s of[-1,1]){ctx.save();ctx.translate(r*.04+s*r*.18,-r*1.48);ctx.rotate(s*.6);ctx.beginPath();ctx.ellipse(0,0,r*.2,r*.1,0,0,Math.PI*2);fs('#5fbf4a',C.out,ow);ctx.restore();}}
  if(p.hat==='horns'){for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*r*.38,-r*.98);ctx.quadraticCurveTo(s*r*.8,-r*1.25,s*r*.62,-r*1.62);ctx.quadraticCurveTo(s*r*.5,-r*1.3,s*r*.18,-r*1.08);ctx.closePath();fs('#5a3d7a',C.out,ow*1.4);}}
  if(crown){const w=r*.95,h=w*.55,cy=-r*1.18;ctx.beginPath();ctx.moveTo(-w/2,cy+h*.5);ctx.lineTo(-w/2,cy-h*.25);ctx.lineTo(-w*.25,cy+h*.05);ctx.lineTo(0,cy-h*.5);ctx.lineTo(w*.25,cy+h*.05);ctx.lineTo(w/2,cy-h*.25);ctx.lineTo(w/2,cy+h*.5);ctx.closePath();fs(C.gold,C.out,w*.12);}
  ctx.restore();
  ctx.save();shapePath(p.shape,x,y+r*1.55*pop,r*.22*pop);fs(p.col,C.out,4);ctx.restore();
}

// ---------- doblón ----------
function coin(x,y,r,t,ph,a=1){ctx.save();ctx.globalAlpha=a;const s=Math.abs(Math.cos(t*4.2+ph))*.82+.18;
  ctx.beginPath();ctx.ellipse(x,y,r*s,r,0,0,Math.PI*2);fs(C.goldDk,C.out,r*.28);
  ctx.beginPath();ctx.ellipse(x,y,r*s*.76,r*.76,0,0,Math.PI*2);ctx.fillStyle=C.gold;ctx.fill();
  ctx.beginPath();ctx.ellipse(x-r*s*.22,y-r*.28,r*s*.22,r*.28,0,0,Math.PI*2);ctx.fillStyle='rgba(255,246,194,.85)';ctx.fill();
  ctx.restore();}

// ---------- alfiler ----------
function pin(cx,cy,len,ang){ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(len/2,0);ctx.lineWidth=17;ctx.strokeStyle=C.out;ctx.stroke();
  const g=ctx.createLinearGradient(0,-5,0,5);g.addColorStop(0,'#eef0f7');g.addColorStop(1,'#8f95ab');ctx.lineWidth=9;ctx.strokeStyle=g;ctx.stroke();
  ctx.beginPath();ctx.arc(len/2+14,0,28,0,Math.PI*2);const hg=ctx.createRadialGradient(len/2+6,-10,4,len/2+14,0,28);hg.addColorStop(0,'#ffb3b5');hg.addColorStop(1,'#ff5a5f');fs(hg,C.out,10);
  ctx.restore();}

// ---------- logo ----------
const L1='VOODOO', L2='COMBO';
function logo(t,t0,cx,cy,sc=1){
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);
  ctx.font='190px "Lilita One"';const adv=[...L1].map(ch=>ctx.measureText(ch).width);const tot=adv.reduce((a,b)=>a+b,0);
  let x=-tot/2;
  [...L1].forEach((ch,i)=>{const ti=t0+i*.07,u=prog(t,ti,ti+.4);
    if(u>0)text(ch,x+adv[i]/2,-105-420*(1-eOutBounce(u)),190,{ow:9,shadow:[0,12,'#5a2e8a'],alpha:Math.min(1,u*4)});x+=adv[i];});
  const tc=t0+.75,u2=prog(t,tc,tc+.28);
  if(u2>0)text(L2,0,95,250,{fill:goldGrad,ow:11,shadow:[0,14,'#7a4a0c'],sc:lerp(2.4,1,eOutBack(u2)),alpha:Math.min(1,u2*3)});
  const tp=t0+1.25,u3=prog(t,tp,tp+.18);
  if(u3>0){ctx.font='250px "Lilita One"';const w2=ctx.measureText(L2).width,wo=ctx.measureText('O').width;
    const ox=w2/2-wo/2,oy=95,o=(1-eOutCubic(u3))*360;pin(ox+o,oy-o,300,-Math.PI/4);}
  ctx.restore();
}

// ---------- partículas ----------
let parts=[];
function burst(x,y,n,col,spd=600){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(.3+Math.random()*.7);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6,max:.6,size:6+Math.random()*6,col,kind:'spark'});}}
function puff(x,y){for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,v=120+Math.random()*160;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.55,max:.55,size:22+Math.random()*16,col:C.purple,kind:'puff'});}}
function confetti(){const cols=['#ff5a5f','#3da5ff','#7be042','#f3eefc',C.gold];for(let i=0;i<90;i++)
  parts.push({x:Math.random()*W,y:-30-Math.random()*300,vx:(Math.random()-.5)*200,vy:200+Math.random()*250,life:3,max:3,size:12,col:cols[i%5],kind:'conf',rot:Math.random()*6,vr:(Math.random()-.5)*12});}
function drawParts(dt){parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.kind==='spark'){p.vx*=.9;p.vy*=.9;} if(p.kind==='puff'){p.vx*=.92;p.vy*=.92;} if(p.kind==='conf'){p.rot+=p.vr*dt;p.vy+=60*dt;}});
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){const u=p.life/p.max;ctx.save();
    if(p.kind==='spark'){ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);ctx.globalAlpha=Math.min(1,u*1.6);ctx.fillStyle=p.col;const s=p.size*u;ctx.fillRect(-s/2,-s/2,s,s);}
    else if(p.kind==='puff'){ctx.globalAlpha=.6*u;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+(1-u)*1.2),0,Math.PI*2);ctx.fill();}
    else {ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,u*2);ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);}
    ctx.restore();}}

// ---------- monedas de fondo ----------
const rain=[...Array(46)].map((_,i)=>({x:Math.random()*W,y:Math.random()*H,v:90+Math.random()*160,r:10+Math.random()*16,ph:Math.random()*6,a:.18+Math.random()*.25}));

// ---------- sonido (WebAudio sintetizado) ----------
let ac=null; const fired=new Set();
function tone(f,d,type='sine',g=.25,f2=null,delay=0){if(!ac)return;const t0=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  v.gain.setValueAtTime(g,t0);v.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(v).connect(ac.destination);o.start(t0);o.stop(t0+d+.02);}
function noise(d,g=.3,hp=2000){if(!ac)return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;v.gain.value=g;s.connect(f).connect(v).connect(ac.destination);s.start();}
const sfx={tok:()=>tone(780,.08,'sine',.25),impact:()=>{tone(150,.5,'sine',.9,40);noise(1.2,.25,3000);},
  tink:()=>{tone(3100,.6,'sine',.12);tone(4650,.5,'sine',.08);}, puff:()=>noise(.3,.15,400),
  cling:(s)=>{const k=Math.pow(2,s/12);tone(988*k,.06,'sine',.18);tone(1319*k,.25,'sine',.2,null,.05);},
  pop:()=>tone(520,.1,'sine',.25,900), drum:()=>tone(110,.3,'sine',.6,70)};
function cue(id,t,at,fn){if(t>=at&&!fired.has(id)){fired.add(id);fn();}}
document.getElementById('snd').addEventListener('click',e=>{
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(_){return;} e.target.textContent='Sonido activado';}
});

// ---------- línea de tiempo ----------
const DOLLS=[{p:PL[0],x:720},{p:PL[1],x:900},{p:PL[2],x:1080},{p:PL[3],x:1260}];
let start=null,last=0,loopN=-1;
function frame(now){
  if(start===null)start=now;
  const tAll=(now-start)/1000, t=tAll%LOOP, dt=Math.min(.05,tAll-last); last=tAll;
  const n=Math.floor(tAll/LOOP); if(n!==loopN){loopN=n;fired.clear();parts=[];}
  ctx.setTransform(1,0,0,1,0,0);
  // fondo
  const bg=ctx.createRadialGradient(W/2,H*.45,60,W/2,H*.45,H*1.05);bg.addColorStop(0,'#3a1f5c');bg.addColorStop(1,C.bg);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // lluvia de doblones de fondo
  const rainA=prog(t,3.4,4.2)*(1-prog(t,9.2,9.8));
  for(const c of rain){const y=(c.y+c.v*tAll)%(H+80)-40;coin(c.x,y,c.r,tAll,c.ph,c.a*rainA);}

  // 0-1.3: ojos de botón en la oscuridad
  if(t<1.4){const a=prog(t,.1,.6)*(1-prog(t,1.1,1.4));ctx.save();ctx.globalAlpha=a;
    const open=t>.75&&t<.88?.1:1;
    for(const sx of[-1,1]){ctx.save();ctx.translate(W/2+sx*150,H/2);ctx.scale(1,open);
      ctx.beginPath();ctx.arc(0,0,86,0,Math.PI*2);fs('#1e1430',C.out,10);
      ctx.beginPath();ctx.arc(0,0,60,0,Math.PI*2);ctx.lineWidth=8;ctx.strokeStyle='#3b2c52';ctx.stroke();
      ctx.fillStyle=C.gold;ctx.shadowColor=C.gold;ctx.shadowBlur=24;
      for(const[a2,b2]of[[-1,-1],[1,-1],[-1,1],[1,1]]){ctx.beginPath();ctx.arc(a2*22,b2*22,11,0,Math.PI*2);ctx.fill();}
      ctx.restore();}
    ctx.restore();
    text('En una arena maldita…',W/2,H*.78,52,{font:'Baloo 2',weight:'800',fill:C.dim,alpha:prog(t,.3,.7)*(1-prog(t,1.05,1.35))});
  }

  // logo con temblor al golpear COMBO
  const T0=1.4, slam=T0+.83; let shx=0,shy=0;
  if(t>slam&&t<slam+.5){const k=22*Math.exp(-(t-slam)*9);shx=(Math.random()-.5)*k;shy=(Math.random()-.5)*k;}
  const out=prog(t,9.3,9.9);
  if(t>=T0){ctx.save();ctx.translate(shx,shy);ctx.globalAlpha=1-out;logo(t,T0,W/2,H*.36,.92);ctx.restore();}
  for(let i=0;i<6;i++)cue('tok'+i,t,T0+i*.07+.15,sfx.tok);
  cue('impact',t,slam,()=>{sfx.impact();burst(W/2,H*.36+90,40,C.gold,900);});
  cue('tink',t,T0+1.43,()=>{sfx.tink();burst(W/2+330,H*.36+90,18,'#fff',500);});

  // muñecos
  DOLLS.forEach((d,i)=>{const tp=3.0+i*.12,u=prog(t,tp,tp+.35);if(u<=0)return;
    cue('puff'+i,t,tp,()=>{puff(d.x,H*.8);sfx.puff();});
    const bob=Math.sin(tAll*5+i)*6, hop=t>5.6&&t<6.6&&i===0?-Math.abs(Math.sin((t-5.6)*Math.PI*3))*60:0;
    ctx.save();ctx.globalAlpha=1-out;
    doll(d.p,d.x,H*.8+bob+hop,62,tAll,{pop:eOutBack(u),squash:i===0&&t>5.6&&t<6.6?Math.sin(t*20)*.08:0,crown:i===0&&t>7.0,blinkOff:i*.7,look:[(Math.sin(tAll*.8+i))*.6,.3]});
    ctx.restore();});

  // tagline
  text('RECOGE · ENCADENA · ROBA',W/2,H*.585,50,{font:'Baloo 2',weight:'800',fill:C.dim,alpha:prog(t,3.5,3.9)*(1-prog(t,5.35,5.55))});
  cue('tag',t,3.5,sfx.pop);

  // combo sobre el muñeco coral
  const combo=[[4.4,'x2 ¡Combo!',C.orange,1],[5.0,'x3 ¡Vudú!',C.pink,2]];
  combo.forEach(([at,s,col,tier],i)=>{const u=prog(t,at,at+.18),e=prog(t,at+.5,at+.6);if(u>0&&e<1){
    text(s,720,H*.8-170-30*eOutCubic(prog(t,at,at+.6)),48,{fill:col,ow:6,sc:lerp(1.6,1,eOutBack(u)),alpha:1-e});}
    cue('c'+i,t,at,()=>{for(let k=0;k<4;k++)setTimeout(()=>sfx.cling(k+tier*4),k*90);});});
  // ¡VOODOO COMBO!
  const vc=5.6,uv=prog(t,vc,vc+.25),ev=prog(t,6.9,7.2);
  if(uv>0&&ev<1){ctx.save();ctx.globalAlpha=.35*(1-prog(t,vc,vc+.3));ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore();
    text('¡VOODOO COMBO!',W/2,H*.6,150,{fill:rainbow(tAll),ow:12,shadow:[0,12,'#2a1240'],sc:lerp(2,1,eOutBack(uv))*(1+.03*Math.sin(tAll*16)),rot:-.04,alpha:1-ev});}
  cue('vc',t,vc,()=>{sfx.impact();confetti();for(let k=0;k<6;k++)setTimeout(()=>sfx.cling(12+k*2),k*70);});

  // información final
  const ia=prog(t,7.3,7.7)*(1-out);
  text('2–4 JUGADORES · PARTIDAS DE 90 s · MULTIJUGADOR EN RED',W/2,H*.585,46,{fill:'#fff',ow:5,alpha:ia});
  text('DevChallenge3 · Godot + Claude + Codex',W/2,H*.585+60,34,{font:'Baloo 2',weight:'800',fill:C.gold,alpha:prog(t,7.7,8.1)*(1-out)});
  cue('info',t,7.3,sfx.drum);

  drawParts(dt);
  // viñeta
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}
const go=()=>requestAnimationFrame(frame);
(document.fonts&&document.fonts.ready)?document.fonts.ready.then(go,go):go();
})();
</script>
